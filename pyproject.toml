[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# All bare keys of [project] must stay above the [project.*] sub-tables.
[project]
name = "storypy-climate"
version = "0.0.1"
description = "A Python package to compute climate storylines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Richard Alawode", email = "richard.alawode@uni-leipzig.de" }
]
keywords = ["climate", "storylines", "CMIP6", "regional climate", "uncertainty"]
dependencies = [
    # core data model + I/O
    "numpy",
    "pandas",
    "xarray",
    "netcdf4",
    "regionmask",
    # statistics
    "scipy",
    "statsmodels",
    "scikit-learn",
    # plotting
    "matplotlib",
    "cartopy",
    "shapely",
    # progress reporting
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
performance = ["dask"]
paper       = ["adjustText"]
dev         = ["pytest", "pytest-cov"]

[project.urls]
Homepage      = "https://storypy.readthedocs.io/en/latest/"
Documentation = "https://storypy.readthedocs.io/en/latest/"
Source        = "https://github.com/LIM-Climate-Causality/storypy"
Issues        = "https://github.com/LIM-Climate-Causality/storypy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["storypy*"]

[tool.setuptools.package-data]
storypy = [
    "*.yml",
    "*.nc",
    "*.json",
    "*.csv",
    "data/regression_output/pr/*",
    "data/regression_output/ua/*",
    "data/remote_drivers/*.csv",
    "data/targets/*.nc",
    "data/drivers/*.nc",
]