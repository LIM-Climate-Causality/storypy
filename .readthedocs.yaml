# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    # sphinx, sphinx-rtd-theme and myst-parser (needed for the Markdown pages)
    - requirements: docs/requirements.txt
    # storypy and its dependencies, so autodoc imports the real modules
    - method: pip
      path: .

sphinx:
  configuration: docs/source/conf.py
